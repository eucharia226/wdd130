<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="styles/poll-form.css" />
  </head>
  <body>

    <h1>WDD 130 | HTML form - User poll</h1>
    
    <form>
      <div class="form-item column2">
        <p>Contact informations</p>
      <label for="fullName">Full Name:</label>
      <input type="text" id="fullName" name="fullName" required />
      <br>
      </div>


      <div class="form-item column2">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required />
      <p>Questions</p>
      </div>


      <div class="form-item column2 column1">
      <label for="browser">What is your favorite internet browser</label>
      <select name="browser" id="browser">
        <option value="chrome">chrome</option>
        <option value="firefox">firefox</option>
        <option value="edge">edge</option>
        <option value="other">other</option>
      </select>
      <br>
      </div>


      <div class="form-item column2 column1">
      <label for="pet">do you have a household pet</label>
      <input type="checkbox" id="pet" name="pet">
      <br>
      </div>

      <div class="form-item column2">
      <label for="feedback">List the places you have lived</label>
      <textarea name="feedback" id="feedback" placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
    </textarea>
    <br> <br>
      </div>


      <button type="submit">Submit Poll</button>
    </form>
  </body>
</html>
