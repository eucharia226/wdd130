    <main>
      <div class="raft">
        <h1>RiverRush Rafting</h1>
        <p>
          Bariga Waterfront Jetty Ilaje Road, Bariga, Lagos 102216, Nigeria <br>
                +234 803 123 4567 <br>
        info@riverrushrafting.com
        </p>
      </div>
      <div class="contact">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1981.9734997960213!2d3.3985295205946686!3d6.528378498372881!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x103b8dc28b81bf31%3A0x7e5def7ab3cfd305!2sBariga%20Waterfront%20Jetty!5e0!3m2!1sen!2sng!4v1791060357863!5m2!1sen!2sng" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      
      
      <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required >
        <br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="john.doe@example.com" required >
<br>
        <fieldset>
          <legend>Message Purpose:</legend>

          <div class="purpose">
          <label for="general"> 
            <input type="radio" name="purpose" id="general" value="general" >
            General Inquiry</label>
           
          <br>

        <label for="question"> 
          <input type="radio" name="purpose" id="question" value="reservation" >
          Reservation Question</label>
        <br>

        <label for="suggestion">
          <input type="radio" name="purpose" id="suggestion" value="suggestion" >
          Website Suggestion
        </label>
        <br>
          </div>
        </fieldset>

        <label class="lab" for="message">Message:</label>
        <textarea id="message" name="message" required></textarea>
        <br>

        <label class="checkbox" for="subscribe">
        <input type="checkbox" id="subscribe" name="subscribe" >
          Please subscribe me to our monthly newsletter</label
        >
        <br>

        <button type="submit">Get in Touch</button>
      </form>
      

      </div>

  

      <section class="middle">
        <h2>We Are Here To Serve You</h2>
        <figure>
        <img src="/wdd130/wwr/images/rafting17_600.jpg" alt="" >
